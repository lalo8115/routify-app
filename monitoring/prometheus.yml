global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: trapo-app
    metrics_path: /api/healthz
    scheme: http
    static_configs:
      - targets:
          - app1:3000
          - app2:3000